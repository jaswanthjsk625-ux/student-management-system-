

<!DOCTYPE html>
<html>
<head><title>Edit</title></head>
<body>
<h2>Edit Student</h2>
<a href="/app1/home/">Home</a>
<hr>
<form method="POST">
{% csrf_token %}
Name: <input type="text" name="name" value="{{ student.name }}"><br><br>
Roll: <input type="text" name="roll" value="{{ student.roll_no }}"><br><br>
Course: <input type="text" name="course" value="{{ student.course }}"><br><br>
Fees: <input type="number" name="fees" value="{{ student.fees }}"><br><br>
<button type="submit">Update</button>
</form>
</body>
</html>
